<svg viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b5de5"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
  </defs>

  <!-- icono: hexagono con N -->
  <g transform="translate(4,6)">
    <polygon points="24,0 45,12 45,36 24,48 3,36 3,12"
             fill="none" stroke="url(#gradN)" stroke-width="3"/>
    <text x="24" y="33" text-anchor="middle" font-family="Orbitron, sans-serif"
          font-size="22" font-weight="800" fill="url(#gradN)">N</text>
  </g>

  <!-- texto de marca -->
  <text x="62" y="30" font-family="Orbitron, sans-serif" font-size="20" font-weight="800" fill="#e6e6f0">
    NEXUS
  </text>
  <text x="62" y="48" font-family="Orbitron, sans-serif" font-size="13" font-weight="700" fill="#00f5ff" letter-spacing="3">
    STORE
  </text>
</svg>
